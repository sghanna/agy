<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Emerald Felt Background -->
    <radialGradient id="feltBgC4" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#184832"/>
      <stop offset="60%" stop-color="#0b2217"/>
      <stop offset="100%" stop-color="#040e0a"/>
    </radialGradient>

    <!-- Imperial Carmine Ruby Gradient -->
    <radialGradient id="rubyGradC4" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="25%" stop-color="#dc2626"/>
      <stop offset="60%" stop-color="#c01525"/>
      <stop offset="85%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGradC4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowC4" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.4"/>
    </filter>

    <clipPath id="squircleClipC4">
      <rect x="0" y="0" width="512" height="512" rx="115"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircleClipC4)">
    <!-- Emerald Table Felt Background -->
    <rect width="512" height="512" fill="url(#feltBgC4)"/>

    <!-- Concentric Gold Filigree Rings -->
    <circle cx="256" cy="256" r="236" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.25"/>
    <circle cx="256" cy="256" r="226" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8,6" stroke-opacity="0.3"/>

    <!-- Gold Medallion Backing Disk -->
    <circle cx="256" cy="256" r="185" fill="#0c261b" stroke="url(#goldGradC4)" stroke-width="5"/>
    <circle cx="256" cy="256" r="172" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4,4" stroke-opacity="0.5"/>

    <!-- HERO EMBLEM: THE SPADE NESTED IN THE RUBY HEART (NO TEXT) -->
    <g filter="url(#shadowC4)">
      <!-- Outer Radiant Ruby Heart -->
      <path d="M 256 405 
               C 142 310 85 240 85 165 
               C 85 105 132 65 192 65 
               C 229 65 249 88 256 102 
               C 263 88 283 65 320 65 
               C 380 65 427 105 427 165 
               C 427 240 370 310 256 405 Z" 
            fill="url(#rubyGradC4)" stroke="url(#goldGradC4)" stroke-width="4.5"/>

      <!-- Heart Jewel Highlight -->
      <ellipse cx="195" cy="140" rx="34" ry="18" fill="rgba(255, 255, 255, 0.4)" transform="rotate(-30 195 140)"/>
      <circle cx="172" cy="122" r="7" fill="rgba(255, 255, 255, 0.65)"/>

      <!-- Center Inset Black Spade (The Queen of Spades inside the Heart) -->
      <g transform="translate(192, 175) scale(0.24)">
        <!-- Gold rim behind spade for maximum separation and pop -->
        <path d="M269 543 C251 506 239 491 176 428 C143 395 109 360 100 350 C78 326 57 293 48 270 C41 251 41 247 41 214 C41 179 41 177 48 164 C58 145 78 125 97 116 C155 88 215 111 245 172 C257 197 260 193 255 159 C250 118 241 92 222 65 L214 53 L270 53 C326 53 326 53 318 65 C299 92 290 118 285 159 C280 193 283 197 295 172 C325 111 385 88 443 116 C462 125 482 145 492 164 C499 177 499 179 499 214 C499 247 499 251 492 270 C483 293 462 326 440 350 C431 360 397 395 364 428 C301 491 289 506 271 543 Z"
              fill="#120505" stroke="url(#goldGradC4)" stroke-width="14"/>
      </g>
    </g>
  </g>
</svg>
