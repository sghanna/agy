<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Emerald Table Felt Background -->
    <radialGradient id="feltBgC6" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1f543b"/>
      <stop offset="60%" stop-color="#0e2a1d"/>
      <stop offset="100%" stop-color="#05140d"/>
    </radialGradient>

    <!-- Imperial Carmine Ruby Gradient -->
    <radialGradient id="rubyGradC6" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="25%" stop-color="#dc2626"/>
      <stop offset="60%" stop-color="#c01525"/>
      <stop offset="85%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </radialGradient>

    <!-- Gold Foil / Brass Gradient -->
    <linearGradient id="goldGradC6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="royalShadowC6" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#fbbf24" flood-opacity="0.4"/>
    </filter>

    <clipPath id="squircleClipC6">
      <rect x="0" y="0" width="512" height="512" rx="115"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircleClipC6)">
    <!-- Emerald Table Felt Background -->
    <rect width="512" height="512" fill="url(#feltBgC6)"/>

    <!-- Inset Golden Fillet -->
    <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="url(#goldGradC6)" stroke-width="2.5" stroke-opacity="0.5"/>
    <rect x="26" y="26" width="460" height="460" rx="90" fill="none" stroke="url(#goldGradC6)" stroke-width="1" stroke-dasharray="5,4" stroke-opacity="0.3"/>

    <!-- Concentric Gold Filigree Rings in Felt -->
    <circle cx="256" cy="275" r="160" fill="none" stroke="url(#goldGradC6)" stroke-width="1.8" stroke-opacity="0.35"/>
    <circle cx="256" cy="275" r="172" fill="none" stroke="url(#goldGradC6)" stroke-width="1" stroke-dasharray="6,6" stroke-opacity="0.25"/>

    <!-- ROYAL COMPOSITION: CROWNED RUBY HEART (NO TEXT) -->
    <g filter="url(#royalShadowC6)">
      <!-- Sculpted Ruby Heart -->
      <path d="M 256 430 
               C 142 335 85 265 85 190 
               C 85 130 132 90 192 90 
               C 229 90 249 113 256 127 
               C 263 113 283 90 320 90 
               C 380 90 427 130 427 190 
               C 427 265 370 335 256 430 Z" 
            fill="url(#rubyGradC6)" stroke="url(#goldGradC6)" stroke-width="4.5"/>

      <!-- Heart Jewel Specular Glint -->
      <ellipse cx="195" cy="165" rx="36" ry="20" fill="rgba(255, 255, 255, 0.42)" transform="rotate(-30 195 165)"/>
      <circle cx="172" cy="148" r="8" fill="rgba(255, 255, 255, 0.7)"/>

      <!-- 3-POINT ROYAL GOLD FLAME CROWN (Positioned atop the heart's cleave) -->
      <g transform="translate(256, 92)">
        <!-- Crown Base Band with Rubies -->
        <path d="M -75 22 L 75 22 L 62 36 L -62 36 Z" fill="url(#goldGradC6)" stroke="#92400e" stroke-width="1.5"/>
        <circle cx="-35" cy="29" r="3" fill="#c01525"/>
        <circle cx="0" cy="29" r="3.5" fill="#c01525"/>
        <circle cx="35" cy="29" r="3" fill="#c01525"/>

        <!-- 3 Regal Peaks -->
        <path d="M -70 22 L -58 -22 L -30 10 L 0 -48 L 30 10 L 58 -22 L 70 22 Z" 
              fill="url(#goldGradC6)" stroke="#92400e" stroke-width="2.5"/>

        <!-- Crown Peak Jewels -->
        <circle cx="0" cy="-48" r="9" fill="#ef4444" stroke="#fef08a" stroke-width="2.5"/>
        <circle cx="-58" cy="-22" r="6.5" fill="#ef4444" stroke="#fef08a" stroke-width="2"/>
        <circle cx="58" cy="-22" r="6.5" fill="#ef4444" stroke="#fef08a" stroke-width="2"/>

        <!-- Center Flaming Gold Pearl -->
        <circle cx="0" cy="0" r="5" fill="#fef08a"/>
      </g>
    </g>
  </g>
</svg>
