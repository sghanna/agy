<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Emerald Table Felt -->
    <radialGradient id="feltBgC1" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1f543b"/>
      <stop offset="60%" stop-color="#0e2a1d"/>
      <stop offset="100%" stop-color="#05140d"/>
    </radialGradient>

    <!-- Imperial Carmine Ruby Gradient -->
    <radialGradient id="rubyGradC1" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="25%" stop-color="#dc2626"/>
      <stop offset="60%" stop-color="#c01525"/>
      <stop offset="85%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGradC1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Deep Drop Shadow & Soft Glow -->
    <filter id="heartShadowC1" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#fbbf24" flood-opacity="0.35"/>
    </filter>

    <clipPath id="squircleClipC1">
      <rect x="0" y="0" width="512" height="512" rx="115"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircleClipC1)">
    <!-- Emerald Table Felt Background -->
    <rect width="512" height="512" fill="url(#feltBgC1)"/>

    <!-- Inset Gold Squircle Fillet -->
    <rect x="20" y="20" width="472" height="472" rx="98" fill="none" stroke="url(#goldGradC1)" stroke-width="3" stroke-opacity="0.6"/>
    <rect x="28" y="28" width="456" height="456" rx="90" fill="none" stroke="url(#goldGradC1)" stroke-width="1.2" stroke-dasharray="6,5" stroke-opacity="0.4"/>

    <!-- Luminous Centered Halo Ring -->
    <circle cx="256" cy="256" r="165" fill="none" stroke="url(#goldGradC1)" stroke-width="2" stroke-opacity="0.35"/>

    <!-- HERO SCULPTED RUBY HEART (NO TEXT) -->
    <g filter="url(#heartShadowC1)">
      <!-- Main Heart Body -->
      <path d="M 256 425 
               C 130 320 65 240 65 155 
               C 65 85 118 42 185 42 
               C 226 42 248 68 256 84 
               C 264 68 286 42 327 42 
               C 394 42 447 85 447 155 
               C 447 240 382 320 256 425 Z" 
            fill="url(#rubyGradC1)" stroke="url(#goldGradC1)" stroke-width="6"/>

      <!-- Inner Jewel Facet / Specular Highlight -->
      <ellipse cx="195" cy="140" rx="42" ry="24" fill="rgba(255, 255, 255, 0.42)" transform="rotate(-30 195 140)"/>
      <circle cx="168" cy="120" r="10" fill="rgba(255, 255, 255, 0.7)"/>

      <!-- Subtle Lower Bevel Contour -->
      <path d="M 256 405 C 150 310 95 240 95 165 C 95 120 125 75 175 75" 
            fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
