<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Card Stock Surface Gradient -->
    <radialGradient id="cardFaceC2" cx="30%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fdfcf8"/>
      <stop offset="85%" stop-color="#f5f1e4"/>
      <stop offset="100%" stop-color="#e6dfcc"/>
    </radialGradient>

    <!-- Imperial Carmine Ruby Gradient -->
    <radialGradient id="rubyGradC2" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="25%" stop-color="#dc2626"/>
      <stop offset="60%" stop-color="#c01525"/>
      <stop offset="85%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </radialGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGradC2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Drop Shadow for Heart on Card -->
    <filter id="heartShadowC2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4c0519" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <clipPath id="squircleClipC2">
      <rect x="0" y="0" width="512" height="512" rx="115"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircleClipC2)">
    <!-- Full-Bleed Vintage Ivory Playing Card Base -->
    <rect width="512" height="512" fill="url(#cardFaceC2)"/>

    <!-- Subtle Inset Edge Bevel to give physical card tactile presence -->
    <rect x="0" y="0" width="512" height="512" rx="115" fill="none" stroke="#d6cfbe" stroke-width="6"/>

    <!-- Ornate Double Fillet Inset Border (Gold & Imperial Carmine) -->
    <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#goldGradC2)" stroke-width="4"/>
    <rect x="34" y="34" width="444" height="444" rx="82" fill="none" stroke="#c01525" stroke-width="2" stroke-opacity="0.75"/>
    <rect x="42" y="42" width="428" height="428" rx="74" fill="none" stroke="url(#goldGradC2)" stroke-width="1.2" stroke-dasharray="5,4" stroke-opacity="0.7"/>

    <!-- Corner Filigree Flourishes -->
    <path d="M52 82 C64 82 82 64 82 52" fill="none" stroke="url(#goldGradC2)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="82" cy="52" r="3" fill="#d97706"/>
    <path d="M460 82 C448 82 430 64 430 52" fill="none" stroke="url(#goldGradC2)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="430" cy="52" r="3" fill="#d97706"/>
    <path d="M52 430 C64 430 82 448 82 460" fill="none" stroke="url(#goldGradC2)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="82" cy="460" r="3" fill="#d97706"/>
    <path d="M460 430 C448 430 430 448 430 460" fill="none" stroke="url(#goldGradC2)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="430" cy="460" r="3" fill="#d97706"/>

    <!-- TOP-LEFT CORNER HEART PIP (NO TEXT/LETTERS) -->
    <g transform="translate(68, 68) scale(0.18)">
      <path d="M 256 425 C 130 320 65 240 65 155 C 65 85 118 42 185 42 C 226 42 248 68 256 84 C 264 68 286 42 327 42 C 394 42 447 85 447 155 C 447 240 382 320 256 425 Z" 
            fill="#c01525"/>
    </g>

    <!-- BOTTOM-RIGHT CORNER HEART PIP (INVERTED, NO TEXT/LETTERS) -->
    <g transform="translate(444, 444) rotate(180) scale(0.18)">
      <path d="M 256 425 C 130 320 65 240 65 155 C 65 85 118 42 185 42 C 226 42 248 68 256 84 C 264 68 286 42 327 42 C 394 42 447 85 447 155 C 447 240 382 320 256 425 Z" 
            fill="#c01525"/>
    </g>

    <!-- CENTER HERO SCULPTED RUBY HEART (NO TEXT) -->
    <g filter="url(#heartShadowC2)">
      <!-- Subtle Gold Filigree Orbit behind center heart -->
      <circle cx="256" cy="256" r="145" fill="none" stroke="url(#goldGradC2)" stroke-width="1.8" stroke-opacity="0.45"/>
      <circle cx="256" cy="256" r="155" fill="none" stroke="url(#goldGradC2)" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.35"/>

      <!-- Heart Silhouette -->
      <path d="M 256 415 
               C 142 318 85 245 85 168 
               C 85 105 132 64 192 64 
               C 229 64 249 88 256 102 
               C 263 88 283 64 320 64 
               C 380 64 427 105 427 168 
               C 427 245 370 318 256 415 Z" 
            fill="url(#rubyGradC2)" stroke="#7f1d1d" stroke-width="3"/>

      <!-- Inner Specular Light Highlights -->
      <ellipse cx="205" cy="155" rx="36" ry="20" fill="rgba(255,255,255,0.4)" transform="rotate(-30 205 155)"/>
      <circle cx="182" cy="138" r="8" fill="rgba(255,255,255,0.65)"/>
    </g>
  </g>
</svg>
